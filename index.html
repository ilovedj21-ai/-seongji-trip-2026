function getToday(){const d=new Date();let day='';try{day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}catch(e){}return DATES.includes(day)?day:DATES[0]}
let activeDate=getToday(),panel='schedule',placeFilter='전체',placeQuery='';
function nav(){document.getElementById('daybar').innerHTML=DATES.map((d,i)=>`<button class="daybtn ${d===activeDate?'active':''}" data-date="${d}" aria-pressed="${d===activeDate}"><span class="num">11.${18+i}</span><span class="dow">${DATA[d].day} · ${DATA[d].area.split(' · ')[0]}</span></button>`).join('');document.querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click',()=>{activeDate=b.dataset.date;showPanel('schedule');renderSchedule();window.scrollTo({top:0,behavior:'smooth'})}))}
function showPanel(name){panel=name;document.querySelectorAll('.panel').forEach(n=>n.classList.toggle('visible',n.id===name));document.querySelectorAll('.tab').forEach(n=>n.classList.toggle('active',n.dataset.panel===name)); if(name==='schedule')renderSchedule();if(name==='places')renderPlaces();if(name==='memo')renderMemo();if(name==='guide')renderGuide();}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{showPanel(b.dataset.panel);window.scrollTo({top:0,behavior:'smooth'})}));
function card(stop,idx,all){const p=special(resolvePlace(stop.name));let prev=idx?special(resolvePlace(all[idx-1].name)):null;let status=statusOf(stop.id);let rurl=stop.hasRoute&&prev?googleRoute(prev,p):'';let cau=p.caution?`<div class="priority-note">ℹ️ ${esc(p.caution)}</div>`:'';return `<article class="stop ${status}"><span class="node" aria-hidden="true"></span><div class="stop-card"><div class="time">${esc(stop.time)}</div><div class="stop-title"><h3>${esc(stop.name)}</h3><span class="type" data-type="${esc(stop.kind)}">${esc(stop.kind)}</span></div><p class="desc">${esc(stop.desc)}</p><div class="actions"><a class="action primary" href="${esc(mapUrl(p))}" target="_blank" rel="noopener noreferrer">📍 네이버 지도</a>${rurl?`<a class="action" href="${esc(rurl)}" target="_blank" rel="noopener noreferrer">🚗 구간 길찾기</a>`:''}<button type="button" class="check ${status==='done'?'done':status==='skipped'?'skipped':''}" data-id="${stop.id}" aria-label="방문 상태 변경">${status==='done'?'✓ 완료':status==='skipped'?'↷ 생략':'○ 미완료'}</button></div><details class="more"><summary>주소 · 전화 · 개인 메모 펼치기 ▾</summary><div class="detail-text">📌 ${esc(p.address||'주소 확인 필요')}</div>${p.phone?`<div class="detail-text">☎ <a class="inline-phone" href="tel:${p.phone.replace(/[^0-9+]/g,'')}">${esc(p.phone)}</a></div>`:''}${cau}<label class="note-label" for="note-${stop.id}">✍️ 이 장소에서 남길 메모</label><textarea class="note" id="note-${stop.id}" data-note="${stop.id}" placeholder="예: 도착 시각, 기도 내용, 맛있었던 메뉴...">${esc(state.notes[stop.id]||'')}</textarea></details></div></article>`}
function renderSchedule(){nav();let d=DATA[activeDate],c=count(d);let next=d.stops.find(s=>statusOf(s.id)==='todo');let nxt=next?special(resolvePlace(next.name)):null;document.getElementById('schedule').innerHTML=`<div class="section-head"><div><div class="eyebrow">DAY ${DATES.indexOf(activeDate)+1} · ${d.date.slice(5).replace('-','월 ')}일 ${d.weekday}</div><h2>${d.emoji} ${esc(d.title)}</h2><p>${esc(d.subtitle)}</p></div><span class="badge-soft">${esc(d.area)}</span></div><div class="daytip">${esc(d.tip.replace('⭐','✨'))}</div><div class="stats"><div class="stat"><span>전체 일정</span><b>${c.all}<small style="font-size:12px">곳</small></b></div><div class="stat"><span>방문 완료</span><b>${c.done}<small style="font-size:12px">곳</small></b></div><div class="stat"><span>남은 일정</span><b>${c.all-c.done-c.skip}<small style="font-size:12px">곳</small></b></div></div><div class="bar" role="progressbar" aria-valuenow="${c.done}" aria-valuemin="0" aria-valuemax="${c.all}"><div style="width:${Math.round(100*c.done/c.all)}%"></div></div><div class="mini-toolbar"><strong>방문 순서 · ${c.all}개 장소</strong>${nxt?`<a class="secondary-btn" href="${esc(mapUrl(nxt))}" target="_blank" rel="noopener noreferrer">다음 장소 ↗</a>`:'<span class="badge-soft">하루 완료 🎉</span>'}</div><div class="stop-list">${d.stops.map((s,i)=>card(s,i,d.stops)).join('')}</div><p class="notice">방문 상태: 미완료 → 완료 → 생략 → 미완료 순서로 변경됩니다. 입력 내용은 이 브라우저에만 저장됩니다.</p>`;document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{let id=b.dataset.id;state.statuses[id]=({todo:'done',done:'skipped',skipped:'todo'})[statusOf(id)];save();const y=window.scrollY;const details=Array.from(document.querySelectorAll('details[open]')).map(e=>e.closest('.stop')?.querySelector('[data-id]')?.dataset.id);renderSchedule();document.querySelectorAll('.stop').forEach(e=>{if(details.includes(e.querySelector('[data-id]')?.dataset.id))e.querySelector('details').open=true});window.scrollTo(0,y)}));document.querySelectorAll('[data-note]').forEach(t=>t.addEventListener('input',()=>{state.notes[t.dataset.note]=t.value;save()}));}
const filters=['전체','성지','성당','숙소','식사','카페','휴게소','힐링','온천'];
function renderPlaces(){const dom=document.getElementById('places');dom.innerHTML=`<div class="section-head"><div><div class="eyebrow">DIRECTORY · ${DATA.places.length} PLACES</div><h2>📍 장소 바로 찾기</h2><p>식당·카페·휴게소·성지·숙소 주소와 전화</p></div></div><input id="placeSearch" class="search" type="search" value="${esc(placeQuery)}" placeholder="장소명이나 지역 검색" aria-label="장소 검색"><div class="filter-scroll">${filters.map(f=>`<button type="button" class="filter-btn ${placeFilter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div id="placeResults"></div>`;document.getElementById('placeSearch').addEventListener('input',e=>{placeQuery=e.target.value;renderPlaceResults()});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{placeFilter=b.dataset.filter;dom.querySelectorAll('[data-filter]').forEach(n=>n.classList.toggle('active',n.dataset.filter===placeFilter));renderPlaceResults()}));renderPlaceResults();}
function renderPlaceResults(){let q=placeQuery.trim().toLocaleLowerCase();let l=DATA.places.filter(p=>(placeFilter==='전체'||p.kind===placeFilter)&&(!q||(p.name+' '+p.address+' '+p.caution).toLocaleLowerCase().includes(q)));document.getElementById('placeResults').innerHTML=l.length?l.map(orig=>{let p=special(orig);return `<article class="place-card"><div class="type" data-type="${esc(p.kind)}" style="display:inline-block;margin-bottom:8px">${esc(p.kind)}</div><h3>${esc(p.name)}</h3><p>${esc(p.address||'위치 확인 필요')}</p><div class="actions"><a class="action primary" href="${esc(mapUrl(p))}" target="_blank" rel="noopener noreferrer">📍 지도</a><a class="action" href="${esc(currentRoute(p))}" target="_blank" rel="noopener noreferrer">🚗 여기로 길찾기</a>${phoneLink(p.phone)}</div>${p.caution?`<div class="place-meta" style="margin-top:9px">${esc(p.caution)}</div>`:''}</article>`}).join(''):'<div class="empty">검색 결과가 없습니다.</div>';}
const checklist=['숙소 예약내역 확인','차량 연료·타이어 점검','성지 방문시간 및 개방 여부 확인','겉옷·편한 신발·물 준비','숙소 체크인 정보 저장','토요일 대전 도착 건물 주소 입력'];
function renderMemo(){document.getElementById('memo').innerHTML=`<div class="section-head"><div><div class="eyebrow">TRAVEL JOURNAL</div><h2>📝 여행 메모</h2><p>여행 중 떠오르는 생각과 준비사항을 기록하세요.</p></div></div><div class="memo-panel"><h3>나만의 여행 기록</h3><p>작성 즉시 이 기기에 자동 저장됩니다.</p><textarea id="travelNote" class="note big-note" placeholder="오늘 가장 인상적이었던 성지는?&#10;기억에 남을 풍경은?&#10;내일 이동 전에 확인할 사항은?">${esc(state.travelNote||'')}</textarea><div id="saveStatus" class="note-save">● 이 브라우저에 자동 저장</div></div><div class="memo-panel"><h3>✅ 여행 전·중 준비 체크리스트</h3>${checklist.map((label,i)=>`<label class="checkrow"><input type="checkbox" data-check="${i}" ${state.checks[i]?'checked':''}><span>${esc(label)}</span></label>`).join('')}</div><p class="notice">각 장소의 상세 정보에서도 개별 메모를 남길 수 있습니다. 다른 휴대폰이나 브라우저로 옮길 때는 안내·설정의 백업 기능을 이용하세요.</p>`;document.getElementById('travelNote').addEventListener('input',e=>{state.travelNote=e.target.value;save()});document.querySelectorAll('[data-check]').forEach(ch=>ch.addEventListener('change',()=>{state.checks[ch.dataset.check]=ch.checked;save()}))}
function renderGuide(){let phone=document.getElementById('guide');phone.innerHTML=`<div class="section-head"><div><div class="eyebrow">HELP & SETTINGS</div><h2>⚙️ 사용 안내·설정</h2><p>인터넷 없이 일정 확인, 지도는 연결 필요</p></div></div><section class="info-block"><h3>🏁 토요일 도착지 상세 주소</h3><p>‘대전 연구단지’는 지역명입니다. 실제 도착할 건물 주소를 입력하면 마지막 구간 링크에 반영됩니다.</p><input id="destination" class="setting-input" value="${esc(state.destination)}" placeholder="예: 대전광역시 유성구 ..." aria-label="대전 도착지 주소"><div class="utility-actions"><button class="action primary" id="saveDest">주소 저장</button></div><p class="note-save" id="destMsg"></p></section><section class="info-block"><h3>🧭 지도와 내비게이션</h3><ul><li><b>네이버 지도</b>는 장소 검색 링크로 연결됩니다. 검색 결과에서 목적지를 확인한 뒤 길찾기를 시작하세요.</li><li><b>구간 길찾기</b>는 이전 방문지 → 다음 방문지의 구글 지도 자동차 경로입니다. 한국 내 자동차 경로 지원 여부는 지도 서비스에 따라 다릅니다.</li><li>지도를 열 때는 인터넷 연결이 필요합니다. 이 HTML의 일정·주소·메모는 오프라인에서도 볼 수 있습니다.</li></ul></section><section class="info-block"><h3>💾 내 기록 백업·복원</h3><p>방문 체크, 준비물 체크, 메모, 도착지 주소를 JSON 파일 하나로 저장하거나 복원할 수 있습니다.</p><div class="utility-actions"><button class="action primary" id="backupBtn">⬇ 백업 저장</button><button class="action" id="restoreBtn">⬆ 백업 복원</button><button class="action" id="clearBtn">↺ 기록 초기화</button></div></section><section class="info-block"><h3>📱 휴대폰에서 사용하는 방법</h3><ul><li>HTML 파일을 휴대폰에 저장한 뒤 Safari 또는 Chrome과 같은 웹 브라우저에서 여세요.</li><li>날짜 탭으로 하루씩 전환하고, 장소마다 '네이버 지도' 버튼을 눌러 이동하세요.</li><li>방문 상태 버튼을 누르면 진행률이 자동 계산됩니다.</li><li>파일을 다른 브라우저에서 열면 기존 기록이 보이지 않을 수 있으므로 백업을 활용하세요.</li><li>홈 화면 바로가기는 파일을 여는 방식과 휴대폰 운영체제에 따라 지원 여부가 다릅니다. 웹주소로 배포한 경우 일반적으로 추가할 수 있습니다.</li></ul></section><section class="info-block"><h3>📌 일정에서 꼭 기억할 점</h3><p>11월 19일 목요일 주산지는 <b>15시 전후</b> 방문이 핵심입니다. 11월 21일 토요일은 <b>대전 연구단지 16시 도착</b>을 우선하세요.</p><p>상주 신앙고백비의 상세 주소 및 일부 식당·카페 영업시간은 방문 전 재확인하는 것이 좋습니다. 성지·숙소 예약과 실제 도착 지점은 개별 확인이 필요합니다.</p></section>`;
document.getElementById('saveDest').addEventListener('click',()=>{state.destination=document.getElementById('destination').value.trim()||DEFAULT_STATE.destination;save();document.getElementById('destMsg').textContent='✓ 도착지 주소가 저장되었습니다.'});
document.getElementById('backupBtn').addEventListener('click',()=>{let data=new Blob([JSON.stringify({type:'pilgrimage-2026',version:1,state,createdAt:new Date().toISOString()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(data);a.download='성지순례_여행기록_백업.json';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)});
document.getElementById('restoreBtn').addEventListener('click',()=>document.getElementById('restoreFile').click());
document.getElementById('clearBtn').addEventListener('click',()=>{if(confirm('방문 체크와 모든 메모를 초기화할까요? 취소할 수 없습니다.')){state={...DEFAULT_STATE,statuses:{},notes:{},checks:{}};save();renderGuide()}});
}
document.getElementById('restoreFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.type!=='pilgrimage-2026'||!d.state||typeof d.state!=='object')throw Error('백업 형식 오류');if(!confirm('현재 체크와 메모를 백업 기록으로 교체할까요?'))return;state={...DEFAULT_STATE,...d.state,statuses:d.state.statuses||{},notes:d.state.notes||{},checks:d.state.checks||{}};save();showPanel('memo');alert('복원했습니다.')}catch(err){alert('이 여행 웹페이지에서 만든 JSON 백업 파일을 선택해 주세요.')}finally{e.target.value=''}});
nav();renderSchedule();
</script>
</body>
</html>
